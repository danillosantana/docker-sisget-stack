version: "3.8"

x-common-variables: &common-variables
  SIS_MICROSERVICE_USUARIO: http://sis-usuario:8080
  SIS_MICROSERVICE_CAIXA: http://sis-caixa:8080

  SPRING_PROFILES_ACTIVE: "default,prod"
  SPRING_JDBC_URL: "jdbc:mysql://mysql-service:3306/sisget_prod?serverTimezone=America/Sao_Paulo"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_DATASOURCE_PASSWORD: "root"

  JWT_SECRET: tTw2sXXOc4lJn63lLAItQPu7BkBhH5E2O1u8NIMqCz1pwuR7warCqc9rDAPL6UDLLyJa6XH8L8o7s65fXmhEFhxIiC
  JWT_EXPIRATION: 86400000

  JAVA_OPTIONS: "-Duser.timezone=GMT-3"
  TZ: "America/Sao_Paulo"

services:

  traefik:
    image: traefik:v3.5.3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=seu-email@dominio.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-letsencrypt:/letsencrypt"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    networks:
      - sisget-network

  sisget-client:
    image: sisget-client:latest
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`18.231.153.127`)"
        - "traefik.http.routers.frontend.entrypoints=web"
        - "traefik.http.routers.frontend.tls=false"
      replicas: 1
    networks:
      - sisget-network

  sis-gateway:
    image: dsantana87/sis-gateway:1.0.0
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.service1.rule=Host(`18.231.153.127`)"
        - "traefik.http.routers.service1.entrypoints=web"
        - "traefik.http.routers.service1.tls=false"
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      <<: *common-variables
    networks:
      - sisget-network

networks:
  sisget-network:
    driver: overlay

volumes:
  traefik-letsencrypt:
